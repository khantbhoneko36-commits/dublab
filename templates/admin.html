<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DubLab · Reviews Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

<header class="top">
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
        <path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/>
      </svg>
    </span>
    <span class="logo-name">DubLab</span>
  </div>
  <p class="tagline">💬 reviews dashboard</p>
</header>

<main>
  <section class="card">
    <div class="statgrid" id="stats">
      <div class="stat"><span class="stat-num" id="st-total">–</span><span class="stat-label">reviews</span></div>
      <div class="stat"><span class="stat-num" id="st-avg">–</span><span class="stat-label">avg ⭐</span></div>
      <div class="stat"><span class="stat-num" id="st-5">–</span><span class="stat-label">5-star</span></div>
    </div>
    <div class="dist" id="dist"></div>
  </section>

  <section class="card">
    <div class="frow">
      <div class="filters" id="filters">
        <button data-f="all" class="on">အားလုံး</button>
        <button data-f="5">⭐5</button>
        <button data-f="4">⭐4</button>
        <button data-f="3">⭐3</button>
        <button data-f="2">⭐2</button>
        <button data-f="1">⭐1</button>
        <button data-f="msg">💬 စာပါ</button>
      </div>
      <button class="mini" id="refresh">🔄</button>
    </div>
    <div id="list"><p class="note">loading…</p></div>
  </section>
</main>

<footer>Made for creators · DubLab</footer>
<script src="/static/admin.js"></script>
</body>
</html>
